services:
  # Backend — FastAPI (Тут план free нужен, иначе выберет Starter за $7)
  - type: web
    name: game-memory-backend
    runtime: python
    plan: free
    rootDir: game-memory-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: game-memory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://game-memory-ai.onrender.com"]'

  # Frontend — Static HTML (Поменяли тип на static, поле plan полностью убрали)
  - type: static
    name: game-memory-frontend
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  # Database — PostgreSQL (Тут план free нужен, иначе выберет Basic за $10.5)
  - name: game-memory-db
    databaseName: game_memory_db
    user: game_memory_user
    plan: free
